// pick by hashing a string seed
function _hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function pickPhotoFor(label = '') {
  const l = (label || '').toLowerCase();
  let bucket = 'interior';
  if (/(narumi|kira|misaki|portrait|therapist|hands behind)/.test(l)) bucket = /narumi|kira|misaki/.test(l) ? 'therapist' : 'portraitWoman';
  else if (/hero|mood|portrait/.test(l)) bucket = 'hero';
  else if (/mugwort|herb|kiln|tea/.test(l)) bucket = 'mugwort';
  else if (/treatment|bed|massage|body|lymph|head|drainage|spa/.test(l)) bucket = 'treatment';
  else if (/oil|product|apothecary|amber|herbs/.test(l)) bucket = 'product';
  else if (/candle|fireplace|lounge/.test(l)) bucket = 'candle';
  else if (/map|aoyama|station|street/.test(l)) bucket = 'map';
  else if (/entrance|interior|powder|basin|room/.test(l)) bucket = 'interior';

  const arr = PHOTO_BANK[bucket] || PHOTO_BANK.interior;
  const id = arr[_hash(label) % arr.length];
  return U(id);
}

// ─── PH: real photo with stripe fallback ───
function PH({ label, w, h, hue = 30, light = 88, ratio, style = {}, src, noPhoto }) {
  const [failed, setFailed] = React.useState(false);
  const photo = src || (noPhoto ? null : pickPhotoFor(label));
  const bg1 = `oklch(${light}% 0.015 ${hue})`;
  const bg2 = `oklch(${light - 4}% 0.015 ${hue})`;
  const fg = `oklch(${light - 35}% 0.03 ${hue})`;
  const wrap = {
    width: w || '100%',
    height: h || (ratio ? undefined : '100%'),
    aspectRatio: ratio,
    position: 'relative',
    overflow: 'hidden',
    background: `repeating-linear-gradient(135deg, ${bg1} 0 18px, ${bg2} 18px 36px)`,
    ...style,
  };
  if (!photo || failed) {
    return (
      <div style={{ ...wrap, display: 'flex', alignItems: 'center', justifyContent: 'center', color: fg,
        fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace', fontSize: 11, letterSpacing: 0.6,
        textTransform: 'uppercase', textAlign: 'center', padding: 12 }}>
        <span style={{ opacity: 0.8 }}>{label}</span>
      </div>
    );
  }
  return (
    <div style={wrap}>
      <img src={photo} alt={label} onError={() => setFailed(true)}
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
    </div>
  );
}

// ─── Smooth-scroll within an artboard. Scrolls the nearest scroll container
// (the artboard's own scroll context) to the target id.
function smoothScrollTo(rootEl, id) {
  if (!rootEl) return;
  const tgt = rootEl.querySelector('#' + id);
  if (!tgt) return;
  const scroller = rootEl;
  const top = tgt.getBoundingClientRect().top - rootEl.getBoundingClientRect().top + scroller.scrollTop - 8;
  scroller.scrollTo({ top, behavior: 'smooth' });
}

<script type="text/babel" data-presets="env,react">
function ResponsiveDemo() {
  const [w, setW] = React.useState(typeof window !== 'undefined' ? window.innerWidth : 1440);
  const [contentH, setContentH] = React.useState(0);
  const innerRef = React.useRef(null);

  React.useEffect(() => {
    const onResize = () => setW(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const isMobile = w < 800;
  const baseW = isMobile ? 390 : 1440;
  const scale = w / baseW;

  React.useLayoutEffect(() => {
    if (!innerRef.current) return;
    const ro = new ResizeObserver(() => {
      if (innerRef.current) setContentH(innerRef.current.scrollHeight);
    });
    ro.observe(innerRef.current);
    return () => ro.disconnect();
  }, [isMobile]);

  return (
    <div className="demo-stage" style={{ height: contentH * scale || undefined }}>
      <div className="scaler" style={{ width: baseW, transform: 'scale(' + scale + ')' }} ref={innerRef}>
        {isMobile ? <AMobile /> : <ADesktop />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ResponsiveDemo />);
</script>
